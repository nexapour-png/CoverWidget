          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.Switch
          import android.widget.TextView

          /** Plain-code settings screen: setup buttons at the top, then one control per Look option. */
          class SettingsActivity : Activity() {

              private lateinit var status: TextView
              private lateinit var column: LinearLayout

              private fun dp(value: Int) = (value * resources.displayMetrics.density).toInt()

              @Suppress("DEPRECATION")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  column = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(20), dp(20), dp(32))
                  }
                  val scroll = ScrollView(this).apply {
                      addView(column)
                      setOnApplyWindowInsetsListener { v, insets ->
                          v.setPadding(
                              insets.systemWindowInsetLeft, insets.systemWindowInsetTop,
                              insets.systemWindowInsetRight, insets.systemWindowInsetBottom,
                          )
                          insets
                      }
                  }
                  setContentView(scroll)

                  heading("Cover Wallpaper")
                  body("Shows the cover of the song playing in Blazify as your wallpaper.")

                  status = body("")
                  button("1. Allow now-playing access") { openAccessSettings() }
                  button("2. Set as wallpaper") { openWallpaperPicker() }

                  header("Look")
                  val d = Look()
                  switchRow(Prefs.CENTER_SHOWN, "Cover in the middle (off = only top and bottom copies)", d.centerShown)
                  switchRow(Prefs.MIRROR, "Flip the copies (off = plain repeats)", d.mirror)
                  seekRow(Prefs.SIZE_PCT, "Cover size", 30, 100, d.sizePct, "% of width")
                  seekRow(Prefs.OFFSET_PCT, "Vertical position", -30, 30, d.offsetPct, "% of height")
                  seekRow(Prefs.BLUR_PCT, "Blur on the copies", 0, 100, d.blurPct, "%")
                  seekRow(Prefs.DIM_PCT, "Darken", 0, 90, d.dimPct, "%")
                  seekRow(Prefs.FADE_MS, "Fade between songs", 0, 2000, d.fadeMs, "ms")

                  header("Home screen (album icons)")
                  body(
                      "While a song plays, every app icon on the Cover Home screen turns into one of the " +
                          "artist's album or EP covers. With fewer covers than apps, they repeat. " +
                          "Android can't change icons on your normal launcher, so this is its own home screen. " +
                          "Long-press an app for its info/uninstall page.",
                  )
                  button("Use Cover Home as home screen") { openHomeSettings() }
                  switchRow(Prefs.ICON_COVERS, "Album covers as app icons", d.iconCovers)
                  seekRow(Prefs.COLUMNS, "Icons per row", 3, 6, d.columns, "")
                  seekRow(Prefs.CORNER, "Icon corner rounding (50 = circle)", 0, 50, d.corner, "%")

                  header("Behaviour")
                  switchRow(Prefs.ONLY_BLAZIFY, "Only react to Blazify (off = any music app)", d.onlyBlazify)
                  switchRow(Prefs.KEEP_LAST, "Keep the last cover when nothing is playing", d.keepLast)
              }

              override fun onResume() {
                  super.onResume()
                  val enabled = Settings.Secure.getString(contentResolver, "enabled_notification_listeners")
                      ?.contains(packageName) == true
                  status.text = if (enabled) {
                      "Now-playing access: ON"
                  } else {
                      "Now-playing access: OFF. Turn it on for \"Cover Wallpaper\" in the next screen. " +
                          "If the switch is greyed out: Settings > Apps > Cover Wallpaper > ⋮ > Allow restricted settings."
                  }
                  if (enabled) NowPlayingTracker.start(this)
              }

              // ------------------------------------------------------------ actions

              private fun openAccessSettings() {
                  try {
                      startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS))
                  } catch (e: Exception) {
                      startActivity(Intent(Settings.ACTION_SETTINGS))
                  }
              }

              private fun openHomeSettings() {
                  try {
                      startActivity(Intent(Settings.ACTION_HOME_SETTINGS))
                  } catch (e: Exception) {
                      startActivity(Intent(Settings.ACTION_SETTINGS))
                  }
              }

              private fun openWallpaperPicker() {
                  val direct = Intent(WallpaperManager.ACTION_CHANGE_LIVE_WALLPAPER).putExtra(
                      WallpaperManager.EXTRA_LIVE_WALLPAPER_COMPONENT,
                      ComponentName(this, CoverWallpaperService::class.java),
                  )
                  try {
                      startActivity(direct)
                  } catch (e: Exception) {
                      startActivity(Intent(WallpaperManager.ACTION_LIVE_WALLPAPER_CHOOSER))
                  }
              }

              // ------------------------------------------------------------ view helpers

              private fun heading(text: String) {
                  column.addView(TextView(this).apply {
                      this.text = text
                      textSize = 26f
                      typeface = Typeface.DEFAULT_BOLD
                      setPadding(0, 0, 0, dp(8))
                  })
              }

              private fun header(text: String) {
                  column.addView(TextView(this).apply {
                      this.text = text
                      textSize = 18f
                      typeface = Typeface.DEFAULT_BOLD
                      setPadding(0, dp(24), 0, dp(4))
                  })
              }

              private fun body(text: String): TextView {
                  val view = TextView(this).apply {
                      this.text = text
                      textSize = 15f
                      setPadding(0, dp(4), 0, dp(8))
                  }
                  column.addView(view)
                  return view
              }

              private fun button(label: String, onClick: () -> Unit) {
                  column.addView(Button(this).apply {
                      text = label
                      setAllCaps(false)
                      setOnClickListener { onClick() }
                  })
              }

              private fun switchRow(key: String, label: String, default: Boolean) {
                  val prefs = Prefs.sp(this)
                  column.addView(Switch(this).apply {
                      text = label
                      textSize = 15f
                      isChecked = prefs.getBoolean(key, default)
                      setPadding(0, dp(10), 0, dp(10))
                      setOnCheckedChangeListener { _, checked -> prefs.edit().putBoolean(key, checked).apply() }
                  })
              }

              private fun seekRow(key: String, label: String, min: Int, max: Int, default: Int, unit: String) {
                  val prefs = Prefs.sp(this)
                  val current = prefs.getInt(key, default).coerceIn(min, max)

                  val caption = TextView(this).apply {
                      textSize = 15f
                      gravity = Gravity.START
                      setPadding(0, dp(12), 0, 0)
                  }
                  fun show(value: Int) {
                      caption.text = "$label: $value $unit"
                  }
                  show(current)

                  val bar = SeekBar(this).apply {
                      this.max = max - min
                      progress = current - min
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(sb: SeekBar, progress: Int, fromUser: Boolean) {
                              val value = progress + min
                              show(value)
                              if (fromUser) prefs.edit().putInt(key, value).apply()
                          }

                          override fun onStartTrackingTouch(sb: SeekBar) {}
                          override fun onStopTrackingTouch(sb: SeekBar) {}
                      })
                  }
                  column.addView(caption)
                  column.addView(bar, LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT,
                  ))
              }
          }
