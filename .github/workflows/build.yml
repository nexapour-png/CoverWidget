name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create the app project
        run: |
          mkdir -p "$(dirname 'app/build.gradle.kts')"
          cat > 'app/build.gradle.kts' <<'COVER_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.coverwallpaper"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.coverwallpaper"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          COVER_EOF
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'COVER_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- Needed to download cover art when the music app only gives us an image link. -->
              <uses-permission android:name="android.permission.INTERNET" />

              <!-- Lets the home screen see the list of launchable apps. -->
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".LauncherActivity"
                      android:exported="true"
                      android:label="@string/launcher_name"
                      android:launchMode="singleTask"
                      android:stateNotNeeded="true"
                      android:theme="@style/LauncherTheme">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".SettingsActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".CoverWallpaperService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_WALLPAPER">
                      <intent-filter>
                          <action android:name="android.service.wallpaper.WallpaperService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.service.wallpaper"
                          android:resource="@xml/wallpaper" />
                  </service>

                  <!-- Gives the app permission to read "now playing" info of other apps. -->
                  <service
                      android:name=".NowPlayingListenerService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          COVER_EOF
          mkdir -p "$(dirname 'app/src/main/java/com/example/coverwallpaper/AlbumFetcher.kt')"
          cat > 'app/src/main/java/com/example/coverwallpaper/AlbumFetcher.kt' <<'COVER_EOF'
          package com.example.coverwallpaper

          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.os.Handler
          import android.os.Looper
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder
          import java.util.concurrent.Callable
          import java.util.concurrent.ConcurrentHashMap
          import java.util.concurrent.Executors

          /**
           * Finds an artist's albums and EPs (singles are skipped) through Apple's public iTunes Search
           * API, which needs no account or key, and downloads their covers.
           */
          object AlbumFetcher {

              private const val MAX_COVERS = 40
              private const val MAX_BYTES = 4 * 1024 * 1024
              private const val AGENT = "CoverWallpaper/1.0"

              private val main = Handler(Looper.getMainLooper())
              private val io = Executors.newSingleThreadExecutor()
              private val pool = Executors.newFixedThreadPool(4)
              private val cache = ConcurrentHashMap<String, List<Bitmap>>()

              /** Calls [done] on the main thread. The list is empty if nothing was found or offline. */
              fun load(artist: String, done: (List<Bitmap>) -> Unit) {
                  val key = artist.lowercase()
                  cache[key]?.let { done(it); return }

                  io.execute {
                      val covers = runCatching { find(artist) }.getOrDefault(emptyList())
                      if (covers.isNotEmpty()) cache[key] = covers // do not cache failures, so we retry later
                      main.post { done(covers) }
                  }
              }

              // ---------------------------------------------------------------- io thread

              private fun find(artist: String): List<Bitmap> {
                  // "Artist A, Artist B" or "A feat. B": try the full name first, then just the first name.
                  val first = artist.split(Regex(",|&|\\bfeat\\.?\\b|\\bft\\.?\\b|\\bx\\b", RegexOption.IGNORE_CASE))
                      .first().trim()
                  for (name in listOf(artist, first).filter { it.isNotEmpty() }.distinct()) {
                      val covers = findExact(name)
                      if (covers.isNotEmpty()) return covers
                  }
                  return emptyList()
              }

              private fun findExact(name: String): List<Bitmap> {
                  val q = URLEncoder.encode(name, "UTF-8")
                  val search = JSONObject(
                      getText("https://itunes.apple.com/search?term=$q&entity=musicArtist&limit=5"),
                  ).optJSONArray("results") ?: return emptyList()

                  var artistId = -1L
                  for (i in 0 until search.length()) {
                      val item = search.getJSONObject(i)
                      if (item.optString("artistName").equals(name, ignoreCase = true)) {
                          artistId = item.optLong("artistId", -1L)
                          break
                      }
                  }
                  if (artistId < 0 && search.length() > 0) artistId = search.getJSONObject(0).optLong("artistId", -1L)
                  if (artistId < 0) return emptyList()

                  val albums = JSONObject(
                      getText("https://itunes.apple.com/lookup?id=$artistId&entity=album&limit=200"),
                  ).optJSONArray("results") ?: return emptyList()

                  val seen = HashSet<Long>()
                  val urls = ArrayList<String>()
                  for (i in 0 until albums.length()) {
                      val item = albums.getJSONObject(i)
                      if (item.optString("wrapperType") != "collection") continue
                      if (item.optString("collectionName").endsWith(" - Single")) continue // albums and EPs only
                      if (!seen.add(item.optLong("collectionId"))) continue
                      val art = item.optString("artworkUrl100")
                      if (art.isEmpty()) continue
                      urls.add(art.replace("100x100bb", "300x300bb"))
                      if (urls.size >= MAX_COVERS) break
                  }

                  val jobs = urls.map { url -> Callable { runCatching { getBitmap(url) }.getOrNull() } }
                  return pool.invokeAll(jobs).mapNotNull { runCatching { it.get() }.getOrNull() }
              }

              private fun open(url: String): HttpURLConnection =
                  (URL(url).openConnection() as HttpURLConnection).apply {
                      connectTimeout = 8000
                      readTimeout = 8000
                      setRequestProperty("User-Agent", AGENT)
                  }

              private fun getText(url: String): String {
                  val c = open(url)
                  try {
                      check(c.responseCode == 200) { "HTTP ${c.responseCode}" }
                      return c.inputStream.use { it.readBytes().toString(Charsets.UTF_8) }
                  } finally {
                      c.disconnect()
                  }
              }

              private fun getBitmap(url: String): Bitmap? {
                  val c = open(url)
                  try {
                      if (c.responseCode != 200) return null
                      val bytes = c.inputStream.use { it.readBytes() }
                      if (bytes.size > MAX_BYTES) return null
                      return BitmapFactory.decodeByteArray(bytes, 0, bytes.size)
                  } finally {
                      c.disconnect()
                  }
              }
          }
          COVER_EOF
          mkdir -p "$(dirname 'app/src/main/java/com/example/coverwallpaper/CoverRenderer.kt')"
          cat > 'app/src/main/java/com/example/coverwallpaper/CoverRenderer.kt' <<'COVER_EOF'
          package com.example.coverwallpaper

          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.RectF
          import kotlin.math.abs
          import kotlin.math.ceil
          import kotlin.math.max
          import kotlin.math.pow

          /** One cover plus a cached blurred version of it. */
          class Scene(val src: Bitmap) {
              private var blurred: Bitmap? = null
              private var blurredFor = -1

              fun blurred(pct: Int): Bitmap {
                  if (pct <= 0) return src
                  if (pct == blurredFor) blurred?.let { return it }

                  // Shrink a lot, soften, and let bilinear scaling stretch it back: a cheap, smooth blur.
                  val target = max(4, (src.width * 0.5.pow(pct / 12.0)).toInt())
                  val small = Bitmap.createScaledBitmap(src, target, target, true)
                  val soft = small.copy(Bitmap.Config.ARGB_8888, true)
                  boxBlur(soft, 2)
                  boxBlur(soft, 2)

                  blurred = soft
                  blurredFor = pct
                  return soft
              }

              private fun boxBlur(bmp: Bitmap, radius: Int) {
                  val w = bmp.width
                  val h = bmp.height
                  val px = IntArray(w * h)
                  bmp.getPixels(px, 0, w, 0, 0, w, h)
                  val tmp = IntArray(w * h)
                  blurPass(px, tmp, w, h, radius, horizontal = true)
                  blurPass(tmp, px, w, h, radius, horizontal = false)
                  bmp.setPixels(px, 0, w, 0, 0, w, h)
              }

              private fun blurPass(src: IntArray, dst: IntArray, w: Int, h: Int, r: Int, horizontal: Boolean) {
                  val lines = if (horizontal) h else w
                  val length = if (horizontal) w else h
                  for (line in 0 until lines) {
                      for (i in 0 until length) {
                          var a = 0; var rr = 0; var g = 0; var b = 0; var n = 0
                          for (k in -r..r) {
                              val j = i + k
                              if (j < 0 || j >= length) continue
                              val c = if (horizontal) src[line * w + j] else src[j * w + line]
                              a += c ushr 24; rr += (c shr 16) and 0xFF; g += (c shr 8) and 0xFF; b += c and 0xFF
                              n++
                          }
                          val out = ((a / n) shl 24) or ((rr / n) shl 16) or ((g / n) shl 8) or (b / n)
                          if (horizontal) dst[line * w + i] = out else dst[i * w + line] = out
                      }
                  }
              }
          }

          /**
           * Lays out the cover as a grid of square tiles. The tile in the middle is the cover itself;
           * every tile above and below (and beside it, if the cover is narrower than the screen) is a
           * flipped copy, so neighbouring tiles always meet along identical edges.
           */
          class CoverRenderer {

              private val paint = Paint(Paint.FILTER_BITMAP_FLAG or Paint.ANTI_ALIAS_FLAG or Paint.DITHER_FLAG)
              private val dst = RectF()

              /** Draws one cover scene. alpha 0-255 is used for the cross-fade. */
              fun drawScene(canvas: Canvas, w: Int, h: Int, look: Look, scene: Scene, alpha: Int) {
                  val layered = alpha < 255
                  if (layered) canvas.saveLayerAlpha(0f, 0f, w.toFloat(), h.toFloat(), alpha)

                  val side = w * look.sizePct.coerceIn(10, 100) / 100f
                  val left = (w - side) / 2f
                  val top = (h - side) / 2f + h * look.offsetPct / 100f

                  val outer = scene.blurred(look.blurPct)

                  val rowsUp = ceil(top / side).toInt().coerceAtLeast(0)
                  val rowsDown = ceil((h - (top + side)) / side).toInt().coerceAtLeast(0)
                  val colsLeft = ceil(left / side).toInt().coerceAtLeast(0)
                  val colsRight = ceil((w - (left + side)) / side).toInt().coerceAtLeast(0)

                  for (row in -rowsUp..rowsDown) {
                      for (col in -colsLeft..colsRight) {
                          if (row == 0 && col == 0) continue // middle tile is drawn last, sharp
                          drawTile(
                              canvas, outer,
                              left + col * side, top + row * side, side,
                              flipX = look.mirror && abs(col) % 2 == 1,
                              flipY = look.mirror && abs(row) % 2 == 1,
                          )
                      }
                  }

                  if (look.centerShown) drawTile(canvas, scene.src, left, top, side, flipX = false, flipY = false)

                  if (layered) canvas.restore()
              }

              fun drawDim(canvas: Canvas, look: Look) {
                  if (look.dimPct > 0) canvas.drawColor(Color.argb(look.dimPct.coerceIn(0, 100) * 255 / 100, 0, 0, 0))
              }

              private fun drawTile(
                  canvas: Canvas, bmp: Bitmap,
                  x: Float, y: Float, side: Float,
                  flipX: Boolean, flipY: Boolean,
              ) {
                  canvas.save()
                  canvas.translate(x + if (flipX) side else 0f, y + if (flipY) side else 0f)
                  canvas.scale(if (flipX) -1f else 1f, if (flipY) -1f else 1f)
                  // Overdraw by half a pixel so no hairline gaps show between tiles.
                  dst.set(-0.5f, -0.5f, side + 0.5f, side + 0.5f)
                  canvas.drawBitmap(bmp, null, dst, paint)
                  canvas.restore()
              }
          }
          COVER_EOF
          mkdir -p "$(dirname 'app/src/main/java/com/example/coverwallpaper/CoverWallpaperService.kt')"
          cat > 'app/src/main/java/com/example/coverwallpaper/CoverWallpaperService.kt' <<'COVER_EOF'
          package com.example.coverwallpaper

          import android.content.SharedPreferences
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.service.wallpaper.WallpaperService
          import android.view.SurfaceHolder

          class CoverWallpaperService : WallpaperService() {

              override fun onCreateEngine(): Engine = CoverEngine()

              private inner class CoverEngine :
                  Engine(),
                  NowPlayingTracker.Listener,
                  SharedPreferences.OnSharedPreferenceChangeListener {

                  private val ctx = this@CoverWallpaperService
                  private val handler = Handler(Looper.getMainLooper())
                  private val renderer = CoverRenderer()
                  private val frame = Runnable { drawFrame() }

                  private var look: Look = Prefs.load(ctx)
                  private var cur: Scene? = null
                  private var prev: Scene? = null
                  private var fadeStart = 0L
                  private var visible = false
                  private var width = 0
                  private var height = 0

                  override fun onCreate(surfaceHolder: SurfaceHolder) {
                      super.onCreate(surfaceHolder)
                      Prefs.sp(ctx).registerOnSharedPreferenceChangeListener(this)
                      NowPlayingTracker.start(ctx)
                      NowPlayingTracker.addListener(this)
                  }

                  override fun onDestroy() {
                      NowPlayingTracker.removeListener(this)
                      Prefs.sp(ctx).unregisterOnSharedPreferenceChangeListener(this)
                      handler.removeCallbacks(frame)
                      super.onDestroy()
                  }

                  override fun onVisibilityChanged(visible: Boolean) {
                      this.visible = visible
                      if (visible) {
                          look = Prefs.load(ctx)
                          NowPlayingTracker.start(ctx) // retries if access was granted since last time
                          drawFrame()
                      } else {
                          handler.removeCallbacks(frame)
                      }
                  }

                  override fun onSurfaceChanged(holder: SurfaceHolder, format: Int, width: Int, height: Int) {
                      super.onSurfaceChanged(holder, format, width, height)
                      this.width = width
                      this.height = height
                      drawFrame()
                  }

                  override fun onSurfaceDestroyed(holder: SurfaceHolder) {
                      visible = false
                      handler.removeCallbacks(frame)
                      super.onSurfaceDestroyed(holder)
                  }

                  // ------------------------------------------------------------ events

                  override fun onCover(bitmap: Bitmap?) {
                      if (cur?.src === bitmap) return
                      val old = cur
                      if (bitmap == null) {
                          prev = null
                          cur = null
                          fadeStart = 0L
                      } else {
                          prev = old
                          cur = Scene(bitmap)
                          fadeStart = if (old != null && look.fadeMs > 0) SystemClock.uptimeMillis() else 0L
                      }
                      drawFrame()
                  }

                  override fun onSharedPreferenceChanged(sp: SharedPreferences, key: String?) {
                      look = Prefs.load(ctx)
                      if (key == Prefs.ONLY_BLAZIFY || key == Prefs.KEEP_LAST) NowPlayingTracker.refresh()
                      drawFrame()
                  }

                  // ------------------------------------------------------------ drawing

                  private fun drawFrame() {
                      handler.removeCallbacks(frame)
                      if (!visible || width == 0 || height == 0) return

                      val holder = surfaceHolder
                      var canvas: Canvas? = null
                      var animating = false
                      try {
                          canvas = holder.lockCanvas() ?: return
                          canvas.drawColor(Color.BLACK)

                          val old = prev
                          val t = if (fadeStart == 0L || old == null) 1f
                          else ((SystemClock.uptimeMillis() - fadeStart) / look.fadeMs.coerceAtLeast(1).toFloat())
                              .coerceIn(0f, 1f)

                          if (t < 1f && old != null) renderer.drawScene(canvas, width, height, look, old, 255)
                          cur?.let {
                              val alpha = if (t < 1f && old != null) (t * 255).toInt() else 255
                              renderer.drawScene(canvas, width, height, look, it, alpha)
                          }
                          renderer.drawDim(canvas, look)

                          if (t >= 1f) {
                              prev = null
                              fadeStart = 0L
                          } else {
                              animating = true
                          }
                      } finally {
                          canvas?.let {
                              try {
                                  holder.unlockCanvasAndPost(it)
                              } catch (e: IllegalArgumentException) {
                                  // surface went away while drawing
                              }
                          }
                      }
                      if (animating) handler.postDelayed(frame, 16)
                  }
              }
          }
          COVER_EOF
          mkdir -p "$(dirname 'app/src/main/java/com/example/coverwallpaper/LauncherActivity.kt')"
          cat > 'app/src/main/java/com/example/coverwallpaper/LauncherActivity.kt' <<'COVER_EOF'
          package com.example.coverwallpaper

          import android.app.Activity
          import android.content.BroadcastReceiver
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.SharedPreferences
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.graphics.BitmapShader
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Matrix
          import android.graphics.Paint
          import android.graphics.RectF
          import android.graphics.Shader
          import android.graphics.drawable.BitmapDrawable
          import android.graphics.drawable.Drawable
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.BaseAdapter
          import android.widget.GridView
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextView
          import java.util.Random

          /**
           * A minimal home screen. Android does not let one app change another app's icon, so this
           * launcher draws the icons itself: while a song plays, each app shows one of the artist's
           * album or EP covers. With fewer covers than apps, the covers repeat in order.
           */
          class LauncherActivity : Activity(), NowPlayingTracker.ArtistListener,
              SharedPreferences.OnSharedPreferenceChangeListener {

              private class AppEntry(val label: String, val component: ComponentName, val original: Drawable)

              private lateinit var grid: GridView
              private lateinit var adapter: AppAdapter

              private var apps: List<AppEntry> = emptyList()
              private var look = Look()
              private var covers: List<Bitmap> = emptyList()
              private var coverArtist: String? = null
              private var iconDrawables: List<Drawable?> = emptyList()
              private var fetchToken = 0

              private fun dp(value: Int) = (value * resources.displayMetrics.density).toInt()

              private val packageReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context, intent: Intent) {
                      loadApps()
                  }
              }

              @Suppress("DEPRECATION")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  look = Prefs.load(this)

                  grid = GridView(this).apply {
                      numColumns = look.columns.coerceIn(3, 6)
                      verticalSpacing = dp(14)
                      stretchMode = GridView.STRETCH_COLUMN_WIDTH
                      selector = android.graphics.drawable.ColorDrawable(Color.TRANSPARENT)
                      clipToPadding = false
                      setPadding(dp(8), dp(16), dp(8), dp(16))
                      setOnApplyWindowInsetsListener { v, insets ->
                          v.setPadding(
                              dp(8) + insets.systemWindowInsetLeft,
                              dp(16) + insets.systemWindowInsetTop,
                              dp(8) + insets.systemWindowInsetRight,
                              dp(16) + insets.systemWindowInsetBottom,
                          )
                          insets
                      }
                  }
                  adapter = AppAdapter()
                  grid.adapter = adapter
                  grid.setOnItemClickListener { _, _, position, _ -> launch(apps[position]) }
                  grid.setOnItemLongClickListener { _, _, position, _ ->
                      openAppInfo(apps[position])
                      true
                  }
                  setContentView(grid)
                  loadApps()
              }

              override fun onStart() {
                  super.onStart()
                  Prefs.sp(this).registerOnSharedPreferenceChangeListener(this)
                  val filter = IntentFilter().apply {
                      addAction(Intent.ACTION_PACKAGE_ADDED)
                      addAction(Intent.ACTION_PACKAGE_REMOVED)
                      addAction(Intent.ACTION_PACKAGE_CHANGED)
                      addDataScheme("package")
                  }
                  registerReceiver(packageReceiver, filter)
                  look = Prefs.load(this)
                  applyLook()
                  NowPlayingTracker.start(this)
                  NowPlayingTracker.addArtistListener(this)
              }

              override fun onStop() {
                  NowPlayingTracker.removeArtistListener(this)
                  runCatching { unregisterReceiver(packageReceiver) }
                  Prefs.sp(this).unregisterOnSharedPreferenceChangeListener(this)
                  super.onStop()
              }

              @Deprecated("A home screen has nowhere to go back to.")
              override fun onBackPressed() {
                  // stay on the home screen
              }

              override fun onNewIntent(intent: Intent?) {
                  super.onNewIntent(intent)
                  grid.smoothScrollToPosition(0) // pressing Home again scrolls back to the top
              }

              // ------------------------------------------------------------ events

              override fun onArtist(artist: String?) {
                  if (artist == null) {
                      fetchToken++
                      coverArtist = null
                      covers = emptyList()
                      rebuildIcons()
                      return
                  }
                  if (artist == coverArtist) return
                  coverArtist = artist
                  val token = ++fetchToken
                  AlbumFetcher.load(artist) { list ->
                      if (token != fetchToken) return@load // another artist started playing meanwhile
                      covers = list
                      if (list.isEmpty()) coverArtist = null // allow a retry on the next callback
                      rebuildIcons()
                  }
              }

              override fun onSharedPreferenceChanged(sp: SharedPreferences, key: String?) {
                  look = Prefs.load(this)
                  applyLook()
              }

              private fun applyLook() {
                  grid.numColumns = look.columns.coerceIn(3, 6)
                  rebuildIcons()
              }

              // ------------------------------------------------------------ apps

              private fun loadApps() {
                  val pm = packageManager
                  val query = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  apps = pm.queryIntentActivities(query, 0)
                      .map {
                          AppEntry(
                              label = it.loadLabel(pm).toString(),
                              component = ComponentName(it.activityInfo.packageName, it.activityInfo.name),
                              original = it.loadIcon(pm),
                          )
                      }
                      .sortedBy { it.label.lowercase() }
                  rebuildIcons()
              }

              private fun launch(app: AppEntry) {
                  val intent = Intent(Intent.ACTION_MAIN)
                      .addCategory(Intent.CATEGORY_LAUNCHER)
                      .setComponent(app.component)
                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED)
                  try {
                      startActivity(intent)
                  } catch (e: Exception) {
                      // app was removed or cannot be opened
                  }
              }

              private fun openAppInfo(app: AppEntry) {
                  try {
                      startActivity(
                          Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS)
                              .setData(Uri.fromParts("package", app.component.packageName, null)),
                      )
                  } catch (e: Exception) {
                      // nothing to show
                  }
              }

              // ------------------------------------------------------------ icons

              /** App number i gets cover number i, wrapping around when there are fewer covers than apps. */
              private fun rebuildIcons() {
                  val list = covers
                  if (!look.iconCovers || list.isEmpty()) {
                      iconDrawables = List(apps.size) { null }
                  } else {
                      // Same order for the same artist every time, but different artists look different.
                      val order = list.indices.shuffled(Random((coverArtist ?: "").hashCode().toLong()))
                      val size = dp(56)
                      val cache = HashMap<Int, Drawable>()
                      iconDrawables = apps.indices.map { i ->
                          val index = order[i % order.size]
                          cache.getOrPut(index) { roundedIcon(list[index], size, look.corner) }
                      }
                  }
                  adapter.notifyDataSetChanged()
              }

              private fun roundedIcon(src: Bitmap, size: Int, cornerPct: Int): Drawable {
                  val out = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888)
                  val shader = BitmapShader(src, Shader.TileMode.CLAMP, Shader.TileMode.CLAMP).apply {
                      setLocalMatrix(Matrix().apply {
                          setScale(size / src.width.toFloat(), size / src.height.toFloat())
                      })
                  }
                  val paint = Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG).apply { this.shader = shader }
                  val radius = size * cornerPct.coerceIn(0, 50) / 100f
                  Canvas(out).drawRoundRect(RectF(0f, 0f, size.toFloat(), size.toFloat()), radius, radius, paint)
                  return BitmapDrawable(resources, out)
              }

              // ------------------------------------------------------------ grid

              private inner class AppAdapter : BaseAdapter() {
                  override fun getCount() = apps.size
                  override fun getItem(position: Int) = apps[position]
                  override fun getItemId(position: Int) = position.toLong()

                  override fun getView(position: Int, convertView: View?, parent: ViewGroup): View {
                      val cell: LinearLayout
                      val icon: ImageView
                      val label: TextView
                      if (convertView == null) {
                          cell = LinearLayout(this@LauncherActivity).apply {
                              orientation = LinearLayout.VERTICAL
                              gravity = Gravity.CENTER_HORIZONTAL
                          }
                          icon = ImageView(this@LauncherActivity).apply {
                              layoutParams = LinearLayout.LayoutParams(dp(56), dp(56))
                              scaleType = ImageView.ScaleType.FIT_CENTER
                          }
                          label = TextView(this@LauncherActivity).apply {
                              textSize = 12f
                              setTextColor(Color.WHITE)
                              setShadowLayer(4f, 0f, 1f, Color.BLACK)
                              maxLines = 1
                              ellipsize = android.text.TextUtils.TruncateAt.END
                              gravity = Gravity.CENTER
                              setPadding(0, dp(4), 0, 0)
                          }
                          cell.addView(icon)
                          cell.addView(label)
                      } else {
                          cell = convertView as LinearLayout
                          icon = cell.getChildAt(0) as ImageView
                          label = cell.getChildAt(1) as TextView
                      }
                      val app = apps[position]
                      icon.setImageDrawable(iconDrawables.getOrNull(position) ?: app.original)
                      label.text = app.label
                      return cell
                  }
              }
          }
