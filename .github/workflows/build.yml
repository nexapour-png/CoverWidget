          package com.example.coverwallpaper

          import android.content.Context
          import android.content.SharedPreferences

          /** Everything you can tweak about the look. Change defaults here. */
          data class Look(
              /** Only react to Blazify (package starts with com.blazify). Off = any music app. */
              val onlyBlazify: Boolean = true,
              /** Draw the cover itself in the middle. Off = only the flipped copies at top and bottom. */
              val centerShown: Boolean = true,
              /** Size of the cover as a percentage of the screen width. */
              val sizePct: Int = 100,
              /** Moves the whole layout up (negative) or down (positive), as a percentage of screen height. */
              val offsetPct: Int = 0,
              /** true = copies are mirrored/flipped, false = copies are plain repeats. */
              val mirror: Boolean = true,
              /** Blur on the top/bottom copies, 0 to 100. */
              val blurPct: Int = 0,
              /** Black overlay over everything, 0 to 100. */
              val dimPct: Int = 0,
              /** Cross-fade time when the song changes, in milliseconds. */
              val fadeMs: Int = 400,
              /** Keep showing the last cover when nothing is playing. */
              val keepLast: Boolean = true,
              /** Home screen: turn app icons into the artist's album/EP covers. */
              val iconCovers: Boolean = true,
              /** Home screen: icons per row. */
              val columns: Int = 4,
              /** Home screen: icon corner rounding, 0 = square, 50 = circle. */
              val corner: Int = 22,
          )

          object Prefs {
              const val FILE = "cover_prefs"

              const val ONLY_BLAZIFY = "only_blazify"
              const val CENTER_SHOWN = "center_shown"
              const val SIZE_PCT = "size_pct"
              const val OFFSET_PCT = "offset_pct"
              const val MIRROR = "mirror"
              const val BLUR_PCT = "blur_pct"
              const val DIM_PCT = "dim_pct"
              const val FADE_MS = "fade_ms"
              const val KEEP_LAST = "keep_last"
              const val ICON_COVERS = "icon_covers"
              const val COLUMNS = "columns"
              const val CORNER = "corner"

              fun sp(context: Context): SharedPreferences =
                  context.applicationContext.getSharedPreferences(FILE, Context.MODE_PRIVATE)

              fun load(context: Context): Look {
                  val d = Look()
                  val p = sp(context)
                  return Look(
                      onlyBlazify = p.getBoolean(ONLY_BLAZIFY, d.onlyBlazify),
                      centerShown = p.getBoolean(CENTER_SHOWN, d.centerShown),
                      sizePct = p.getInt(SIZE_PCT, d.sizePct),
                      offsetPct = p.getInt(OFFSET_PCT, d.offsetPct),
                      mirror = p.getBoolean(MIRROR, d.mirror),
                      blurPct = p.getInt(BLUR_PCT, d.blurPct),
                      dimPct = p.getInt(DIM_PCT, d.dimPct),
                      fadeMs = p.getInt(FADE_MS, d.fadeMs),
                      keepLast = p.getBoolean(KEEP_LAST, d.keepLast),
                      iconCovers = p.getBoolean(ICON_COVERS, d.iconCovers),
                      columns = p.getInt(COLUMNS, d.columns),
                      corner = p.getInt(CORNER, d.corner),
                  )
              }
          }
