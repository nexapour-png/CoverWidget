          import android.service.notification.NotificationListenerService

          /**
           * Never looks at your notifications. It exists only because Android requires an enabled
           * notification listener before an app may read other apps' media sessions (now playing info).
           */
          class NowPlayingListenerService : NotificationListenerService() {

              override fun onListenerConnected() {
