          mkdir -p "$(dirname 'app/src/main/java/com/example/coverwallpaper/NowPlayingTracker.kt')"
          cat > 'app/src/main/java/com/example/coverwallpaper/NowPlayingTracker.kt' <<'COVER_EOF'
          package com.example.coverwallpaper

          import android.content.ComponentName
          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.media.MediaMetadata
          import android.media.session.MediaController
          import android.media.session.MediaSessionManager
          import android.media.session.PlaybackState
          import android.net.Uri
          import android.os.Handler
          import android.os.Looper
          import java.io.ByteArrayOutputStream
          import java.io.File
          import java.io.FileOutputStream
          import java.io.InputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.concurrent.CopyOnWriteArraySet
          import java.util.concurrent.Executors
          import kotlin.math.min

          /**
           * Watches the media sessions of other apps (Blazify publishes one like every Android player)
           * and turns the current song's artwork into a square bitmap.
           *
           * All state is touched on the main thread only. Network and disk work runs on [io].
           */
          object NowPlayingTracker {

              fun interface Listener {
                  /** Called on the main thread. null = no cover to show. */
                  fun onCover(bitmap: Bitmap?)
              }

              private const val BLAZIFY_PREFIX = "com.blazify"
              private const val MAX_SIDE = 1024
              private const val MAX_DOWNLOAD_BYTES = 12 * 1024 * 1024
              private const val SAVED_FILE = "last_cover.jpg"

              fun interface ArtistListener {
                  /** Called on the main thread. null = no artist known. */
                  fun onArtist(artist: String?)
              }

              private const val LAST_ARTIST_KEY = "last_artist"

              private val listeners = CopyOnWriteArraySet<Listener>()
              private val artistListeners = CopyOnWriteArraySet<ArtistListener>()

              var artist: String? = null
                  private set
              private val main = Handler(Looper.getMainLooper())
              private val io = Executors.newSingleThreadExecutor()

              var cover: Bitmap? = null
                  private set

              private var appContext: Context? = null
              private var started = false
              private var controllers: List<MediaController> = emptyList()
              private var currentKey: String? = null
              private var loadToken = 0

              private val controllerCallback = object : MediaController.Callback() {
                  override fun onMetadataChanged(metadata: MediaMetadata?) = refresh()
                  override fun onPlaybackStateChanged(state: PlaybackState?) = refresh()
                  override fun onSessionDestroyed() = refreshSessions()
              }

              private val sessionsListener =
                  MediaSessionManager.OnActiveSessionsChangedListener { list -> setControllers(list.orEmpty()) }

              // ---------------------------------------------------------------- public API (main thread)

              fun addListener(listener: Listener) {
                  listeners.add(listener)
                  listener.onCover(cover)
              }

              fun removeListener(listener: Listener) {
                  listeners.remove(listener)
              }

              fun addArtistListener(listener: ArtistListener) {
                  artistListeners.add(listener)
                  listener.onArtist(artist)
              }

              fun removeArtistListener(listener: ArtistListener) {
                  artistListeners.remove(listener)
              }

              private fun setArtist(value: String?) {
                  val v = value?.trim()?.takeIf { it.isNotEmpty() }
                  if (v == artist) return
                  artist = v
                  if (v != null) appContext?.let { Prefs.sp(it).edit().putString(LAST_ARTIST_KEY, v).apply() }
                  artistListeners.forEach { it.onArtist(v) }
              }

              /** Safe to call as often as you like. Retries if notification access was not granted yet. */
              fun start(context: Context) {
                  val app = context.applicationContext
                  appContext = app

                  if (cover == null && Prefs.load(app).keepLast) loadSavedCover(app)
                  if (artist == null && Prefs.load(app).keepLast) {
                      setArtist(Prefs.sp(app).getString(LAST_ARTIST_KEY, null))
                  }

                  if (!started) {
                      val manager = app.getSystemService(MediaSessionManager::class.java) ?: return
                      try {
                          manager.addOnActiveSessionsChangedListener(
                              sessionsListener,
                              listenerComponent(app),
                              main,
                          )
                          started = true
                      } catch (e: SecurityException) {
                          return // notification access not granted yet
                      }
                  }
                  refreshSessions()
              }

              /** Re-reads the current song, e.g. after a setting changed. */
              fun refresh() {
                  val app = appContext ?: return
                  val look = Prefs.load(app)

                  val candidates = controllers.filter {
                      !look.onlyBlazify || it.packageName.startsWith(BLAZIFY_PREFIX)
                  }
                  val pick = candidates.firstOrNull { it.playbackState?.state == PlaybackState.STATE_PLAYING }
                      ?: candidates.firstOrNull()

                  if (pick == null) {
                      if (!look.keepLast) {
                          setArtist(null)
                          if (cover != null) {
                              currentKey = null
                              publish(null, save = false)
                          }
                      }
                      return
                  }

                  val md = pick.metadata ?: return
                  setArtist(
                      md.getString(MediaMetadata.METADATA_KEY_ALBUM_ARTIST)
                          ?: md.getString(MediaMetadata.METADATA_KEY_ARTIST),
                  )
                  val uriString = md.getString(MediaMetadata.METADATA_KEY_ALBUM_ART_URI)
                      ?: md.getString(MediaMetadata.METADATA_KEY_ART_URI)
                      ?: md.getString(MediaMetadata.METADATA_KEY_DISPLAY_ICON_URI)
                  val direct = md.getBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART)
                      ?: md.getBitmap(MediaMetadata.METADATA_KEY_ART)
                      ?: md.getBitmap(MediaMetadata.METADATA_KEY_DISPLAY_ICON)

                  val key = listOf(
                      pick.packageName,
                      md.getString(MediaMetadata.METADATA_KEY_MEDIA_ID),
                      md.getString(MediaMetadata.METADATA_KEY_TITLE),
                      md.getString(MediaMetadata.METADATA_KEY_ARTIST),
                      uriString,
                      direct?.width,
                  ).joinToString("|")
                  if (key == currentKey) return
                  currentKey = key

                  val token = ++loadToken
                  io.execute {
                      val bitmap = runCatching { fetch(app, direct, uriString) }.getOrNull()
                      main.post {
                          if (token != loadToken) return@post // a newer song already took over
                          if (bitmap != null) publish(bitmap, save = true) else currentKey = null // retry later
                      }
                  }
              }

              // ---------------------------------------------------------------- sessions

              private fun listenerComponent(app: Context) =
                  ComponentName(app, NowPlayingListenerService::class.java)

              private fun refreshSessions() {
                  val app = appContext ?: return
                  val manager = app.getSystemService(MediaSessionManager::class.java) ?: return
                  try {
                      setControllers(manager.getActiveSessions(listenerComponent(app)))
                  } catch (e: SecurityException) {
                      // not allowed (yet)
                  }
              }

              private fun setControllers(list: List<MediaController>) {
                  controllers.forEach { runCatching { it.unregisterCallback(controllerCallback) } }
                  controllers = list
                  controllers.forEach { it.registerCallback(controllerCallback, main) }
                  refresh()
              }

              private fun publish(bitmap: Bitmap?, save: Boolean) {
                  cover = bitmap
                  listeners.forEach { it.onCover(bitmap) }
                  if (save && bitmap != null) saveCover(bitmap)
              }

              // ---------------------------------------------------------------- artwork loading (io thread)

              private fun fetch(app: Context, direct: Bitmap?, uriString: String?): Bitmap? {
                  // A big embedded bitmap is perfect. A small one is only a thumbnail, so try the link first.
                  if (direct != null && min(direct.width, direct.height) >= 400) return squareAndScale(direct)

                  val loaded = uriString?.let { runCatching { loadUri(app, Uri.parse(it)) }.getOrNull() }
                  val best = loaded ?: direct ?: return null
                  return squareAndScale(best)
              }

              private fun loadUri(app: Context, uri: Uri): Bitmap? {
                  val bytes = when (uri.scheme) {
                      "http", "https" -> download(uri.toString())
                      else -> app.contentResolver.openInputStream(uri)?.use { readLimited(it) }
                  } ?: return null

                  val bounds = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                  BitmapFactory.decodeByteArray(bytes, 0, bytes.size, bounds)
                  var sample = 1
                  while (min(bounds.outWidth, bounds.outHeight) / (sample * 2) >= MAX_SIDE) sample *= 2

                  val options = BitmapFactory.Options().apply { inSampleSize = sample }
                  return BitmapFactory.decodeByteArray(bytes, 0, bytes.size, options)
              }

              private fun download(url: String): ByteArray? {
                  val connection = URL(url).openConnection() as HttpURLConnection
                  return try {
                      connection.connectTimeout = 8000
                      connection.readTimeout = 8000
                      connection.instanceFollowRedirects = true
                      if (connection.responseCode != 200) null
                      else connection.inputStream.use { readLimited(it) }
                  } finally {
                      connection.disconnect()
                  }
              }

              private fun readLimited(input: InputStream): ByteArray? {
                  val out = ByteArrayOutputStream()
                  val buffer = ByteArray(16 * 1024)
                  while (true) {
                      val read = input.read(buffer)
                      if (read < 0) break
                      out.write(buffer, 0, read)
                      if (out.size() > MAX_DOWNLOAD_BYTES) return null
                  }
                  return out.toByteArray()
              }

              /** Center-crops to a square (videos thumbnails are 16:9) and caps the size. */
              private fun squareAndScale(src: Bitmap): Bitmap {
                  val side = min(src.width, src.height)
                  val x = (src.width - side) / 2
                  val y = (src.height - side) / 2
                  val square = if (side == src.width && side == src.height) src
                  else Bitmap.createBitmap(src, x, y, side, side)
                  return if (side > MAX_SIDE) Bitmap.createScaledBitmap(square, MAX_SIDE, MAX_SIDE, true) else square
              }

              // ---------------------------------------------------------------- remember the last cover

              private fun saveCover(bitmap: Bitmap) {
                  val app = appContext ?: return
                  io.execute {
                      runCatching {
                          FileOutputStream(File(app.filesDir, SAVED_FILE)).use {
                              bitmap.compress(Bitmap.CompressFormat.JPEG, 92, it)
                          }
                      }
                  }
              }

              private fun loadSavedCover(app: Context) {
                  io.execute {
                      val saved = runCatching {
                          val file = File(app.filesDir, SAVED_FILE)
                          if (file.exists()) BitmapFactory.decodeFile(file.path) else null
                      }.getOrNull()
                      if (saved != null) {
                          main.post { if (cover == null) publish(saved, save = false) }
                      }
                  }
              }
          }
